# SPEC §8 M15: static UI; /api and /mcp proxied to the backend, unbuffered for SSE.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every proxied location below. `$http_host` keeps the port, so backend
    # redirects (e.g. /mcp -> /mcp/) point at the published port, not :80.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    location / {
        try_files $uri $uri/ /index.html;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /api/imports {
        proxy_pass http://backend:8000;
        client_max_body_size 200m;
    }

    location /mcp {
        proxy_pass http://backend:8000;
    }
}
