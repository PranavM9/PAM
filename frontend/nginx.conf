# SPEC §8 M15: static UI; /api and /mcp proxied to the backend, unbuffered for SSE.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    location / {
        try_files $uri $uri/ /index.html;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /api/chat {
        proxy_pass http://backend:8000;
        add_header X-Accel-Buffering no always;
    }

    location /api/imports {
        proxy_pass http://backend:8000;
        client_max_body_size 200m;
    }

    location /mcp {
        proxy_pass http://backend:8000;
    }

    # SPEC M17: the synthetic T-Mobile mock, so connector card images load in the browser.
    # Resolved per request through Docker's DNS, so nginx still starts when the mock is not running.
    location /connectors/tmobile/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tmobile_mock http://tmobile-mock:8100;
        rewrite ^/connectors/tmobile/(.*)$ /$1 break;
        proxy_pass $tmobile_mock;
    }
}
