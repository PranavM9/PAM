# SPEC §4 Runtime + §8 M15.
services:
  backend:
    build: ./backend
    container_name: pam-backend
    # `pam api serve` refuses an uninitialised vault, so create one on first run. `pam init`
    # runs when /vault has no git repo (a stray pam.toml alone is not a vault: init finishes it
    # and keeps its settings) and refuses a folder with other content, so an existing vault is
    # never touched. A failure exits the container (B-05).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -d /vault/.git ]; then pam init; fi &&
        exec pam api serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PAM_VAULT: /vault
    volumes:
      - ./vault:/vault
      - ./demo:/demo
      # Docker seeds an empty named volume from the image, so the baked models appear on first run.
      # An existing volume is not reseeded: `docker compose down -v` after a model change.
      - pam-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # SPEC §8 M17: synthetic T-Mobile mock API. The backend calls it at http://tmobile-mock:8100;
  # the browser loads its images through the frontend at /connectors/tmobile/.
  tmobile-mock:
    build: ./mock/tmobile
    container_name: pam-tmobile-mock
    environment:
      MOCK_TODAY: "2026-10-18"
      PUBLIC_BASE: /connectors/tmobile
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  ollama:
    image: ollama/ollama
    profiles: [local]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  pam-models:
  ollama-models:
