[project]
name = "pam"
version = "0.1.0"
description = "PAM — Portable Agent Memory"
requires-python = ">=3.12,<3.13"
# Every Python library named in SPEC §8 (M0–M13). T00 owns this file; later tasks may not edit it.
dependencies = [
    # M0 contracts & core
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "tiktoken>=0.7",
    "filelock>=3.13",
    "typer>=0.12",
    "rich>=13.7",
    # M1 importers
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "ijson>=3.3",
    # M3 extractor (en_core_web_sm comes from the wheel URL in [tool.uv.sources], CHG-0007)
    "spacy>=3.7,<4",
    "en-core-web-sm",
    "jinja2>=3.1",
    # M4 indexer / M6 retriever
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "numpy>=1.26",
    # M5 clusterer (sklearn.cluster.HDBSCAN needs >=1.3)
    "scikit-learn>=1.3",
    # M11 MCP server / M12 chat
    "mcp>=1.2",
    "litellm>=1.50",
    # M13 REST API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # M16 connectors (CHG-0027; also the FastAPI TestClient for the M13 tests)
    "httpx>=0.27",
]

[project.scripts]
pam = "pam.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# spaCy models are not on PyPI; `spacy download` needs pip, which the uv venv lacks.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
